# Keeps the Render production backend warm.
name: Keep backend warm

on:
  schedule:
    - cron: "*/8 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: GET /health
        env:
          BACKEND_URL: https://gridcast-api.onrender.com
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            --max-time 80 \
            --write-out '\nHTTP %{http_code} in %{time_total}s\n' \
            "$BACKEND_URL/health"
