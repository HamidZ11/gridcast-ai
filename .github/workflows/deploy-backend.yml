# Deploys the backend to Render when backend/ changes on main, through the
# service's deploy hook. Keep Render's own Auto-Deploy off, or a backend push
# deploys twice. Setup: DEPLOYMENT.md, "Render deploy hook".
name: Deploy backend to Render

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error title=Missing secret RENDER_DEPLOY_HOOK_URL::Add the Render service's deploy hook URL as a repository secret named RENDER_DEPLOY_HOOK_URL (Settings > Secrets and variables > Actions). See DEPLOYMENT.md, \"Render deploy hook\"."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 60 --request POST "$RENDER_DEPLOY_HOOK_URL"
