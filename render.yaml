services:
  - type: web
    name: gridcast-ai-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GRIDCAST_ENVIRONMENT
        value: production
      - key: GRIDCAST_CORS_ORIGINS
        sync: false
